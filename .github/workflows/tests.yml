name: RAG tests and real Milvus
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: pytest -q --junitxml=unit-results.xml
      - name: Start real Milvus Standalone
        run: docker compose -f compose.milvus.yml up -d --wait --wait-timeout 300
      - name: Real database lifecycle tests
        env: {MILVUS_TEST_URI: 'http://127.0.0.1:19530'}
        run: pytest -q tests/test_milvus_integration.py --junitxml=milvus-results.xml
      - name: Retrieval evaluator real-database contract (not semantic model benchmark)
        env:
          RAG_BACKEND: milvus
          EMBEDDING_PROVIDER: hash
          EMBEDDING_DIMENSIONS: '32'
          RAG_VECTOR_DIMENSIONS: '32'
          RERANK_PROVIDER: none
        run: python scripts/evaluate_live_retrieval.py --allow-hash --max-cases 4 --output retrieval-contract-results.json
      - name: Database restart persistence
        run: |
          python scripts/check_milvus_restart.py write
          docker compose -f compose.milvus.yml restart milvus
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:9091/healthz && break || sleep 2; done
          python scripts/check_milvus_restart.py read
      - name: HTTP PDF upload retrieval and deletion
        run: python scripts/check_milvus_api.py
      - name: Logs and results
        if: always()
        run: docker compose -f compose.milvus.yml logs --no-color > milvus-service.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milvus-validation
          path: |
            *results.xml
            milvus-service.log
            milvus-restart-result.json
            milvus-api-result.json
            retrieval-contract-results.json
