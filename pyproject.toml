[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "A policy assistant with FastAPI, LangGraph, Milvus hybrid retrieval, and SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "langgraph>=1.2.6,<2",
    "langchain>=0.2.0",
    "redis>=5.0.0",
    "pymilvus>=2.6.0,<2.7",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the existing lint contract explicit across Ruff upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "docs*", "scripts*", "tests*"]
