include:
  - compose.milvus.yml
services:
  api:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8010:8000"]
    env_file: .env
    environment:
      APP_ENV: docker
      RAG_BACKEND: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-rag_chunks_v1}
      RAG_VECTOR_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      SQLITE_URL: sqlite:///./data/app.db
    depends_on:
      milvus: {condition: service_healthy}
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=30).read()"]
      interval: 30s
      timeout: 35s
      retries: 5
      start_period: 30s
