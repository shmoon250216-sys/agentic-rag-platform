services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      APP_ENV: docker
      RAG_BACKEND: redis
      RAG_VECTOR_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
      REDIS_URL: redis://redis:6379/0
      SQLITE_URL: sqlite:///./data/app.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --save 60 1000"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis-data:
